<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dutiyesh</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      color: #111;
      font-family: system-ui, -apple-system, sans-serif;
    }

    main {
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }

    a {
      font-size: 1rem;
      color: #555;
      text-decoration: none;
      border-bottom: 1px solid #ccc;
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }

    a:hover {
      color: #111;
      border-color: #111;
    }
  </style>
</head>
<body>
  <main>
    <h1>Dutiyesh</h1>
    <a href="https://github.com/dutiyesh" target="_blank" rel="noopener noreferrer">
      GitHub →
    </a>
  </main>
</body>
</html>
